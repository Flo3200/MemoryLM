# MemoryLM preset "quick": the configuration for the first ~4 GPU-hour run.
# Every value is explained in plain language. "full.yaml" only overrides
# the values that change; everything else is inherited from this file.

preset: quick
run_name: quick                # folder of this run on Drive (run_quick/)
seed: 1234                    # one seed for everything (data order, init, sampling)

tokenizer:
  vocab_size: 4096            # number of BPE word pieces the models know
  # Special tokens are reserved ids. <recite> starts a recitation episode,
  # <eos> separates stories, <pad> fills unused positions.
  special_tokens: ["<eos>", "<recite>", "<pad>"]

model:
  d_model: 256                # width of every token vector
  n_layers: 4
  n_heads: 4                  # 4 heads x 64 dims = 256
  context: 128                # tokens the attention can see at once
  ffn_hidden_memorylm: 704    # SwiGLU inner width of MemoryLM
  ffn_hidden_baseline: auto   # "auto" = 864 here: the width that matches MemoryLM's parameter count (0.3 % apart)
  rope_base: 10000.0          # RoPE frequency base (standard value)
  norm_eps: 1.0e-5
  tie_weights: true           # input embedding and output matrix share weights
  dropout: 0.0                # no dropout: the data set is large, the run is short

memory:
  enabled: true
  chunk_size: 32              # text is processed in chunks; writes become readable one chunk later
  capacity: 512               # entries per store (knowledge and rule)
  top_k: 8                    # entries read per query
  key_dim: 64                 # size of memory keys
  write_layer: 2              # stored vectors are computed from the output of this layer (1-based)
  gate_mode: hard_ste         # "hard_ste" (hard decision, sigmoid gradient) or "soft"
  gate_bias_init: 0.5         # slightly positive: the model starts by writing, then learns to be selective
  rule_score_scale: 0.125     # g_i = tanh(scale * k_i . q); keeps rule scores bounded
  write_penalty_lambda: 0.01  # cost per expected write, added to the loss
  write_penalty_ramp_steps: 2000  # lambda grows linearly from 0 over this many steps
  write_penalty_from_phase: 2     # the ramp starts with phase 2 (recitation); see LEARNING.md
  min_write_rate: 0.0         # 0 = off; >0 keeps each store's expected write rate above this (dead-gate guard)
  scalar_lr_mult: 10.0        # learning-rate multiplier for the 8 memory scalars (they start at 0); see LEARNING.md
  sparse_values: false        # off in the quick run (code path kept switchable)
  sparse_value_k: 32          # if on: keep only the 32 largest numbers of each stored vector
  product_keys: false         # off in the quick run (code path kept switchable)
  product_key_candidates: 32  # if on: candidates per key half before exact re-scoring

data:
  hf_repo: roneneldan/TinyStories
  train_file: TinyStoriesV2-GPT4-train.txt
  valid_file: TinyStoriesV2-GPT4-valid.txt
  # Held-out stories for recitation/evaluation are cut from the VALID file,
  # so they never appear in training text.
  recite_eval_stories: 2000
  tokenizer_train_mb: 100     # MB of training text used to learn the BPE merges (plenty for 4096 tokens)

train:
  batch_size: auto            # largest power of two that fits in GPU memory
  max_batch_size: 256
  grad_clip: 1.0
  weight_decay: 0.1
  betas: [0.9, 0.95]
  mixed_precision: fp16       # fp16 + loss scaling on a T4; "bf16" on newer GPUs; "none" on CPU
  phase1:
    lr: 1.0e-3
    warmup_steps: 300
    min_lr_ratio: 0.1         # cosine decay down to 10 % of lr
    tokens: auto              # set by the phase-0 speed test so MemoryLM needs ~60 min
    target_minutes_memorylm: 60
  phase2:
    lr: 3.0e-4
    minutes: 60
    n_start: 16               # recitation length at step 0
    n_growth: 1.001           # multiplied per step, rounded up
    n_max: 128
    text_fraction: 0.5        # half of each batch is normal next-token text
    warmup_steps: 100
    steps: auto               # set by the phase-0 speed test so phase 2 takes `minutes`
  eval_interval_minutes: 5
  val_batches: 20             # fixed validation batches per evaluation
  log_every_steps: 50
  max_rollbacks: 5            # NaN rollbacks before giving up
  speed_test_minutes: 3
  eval_minutes: 30            # reserved for phase 3 in the time plan
  total_gpu_hours: 4.0

eval:
  passages_per_length: 256    # recitation passages per length (16, 32, 64, 128)
  lengths: [16, 32, 64, 128]
  val_windows: 2048           # validation windows for the final loss comparison (~260 k tokens)

checkpoint:
  every_minutes: 15
  every_steps: 0              # 0 = off; tests use a step interval instead of minutes
  keep_last: 2                # plus the best one

paths:
  # On Colab this is the mounted Drive; locally it is a folder in the repo.
  drive_root: /content/drive/MyDrive/MemoryLM
  local_root: runs
