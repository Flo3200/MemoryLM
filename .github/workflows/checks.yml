# Runs on every push: the secret scan (a second line of defence in case the
# local hook was skipped) and the CPU test suite.
name: checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Secret scan
        run: python scripts/check_secrets.py --all
      - name: Install
        run: pip install --index-url https://download.pytorch.org/whl/cpu torch && pip install -r requirements.txt
      - name: Tests
        run: python -m pytest -q
